<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="../icons/icon48.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="modulepreload" href="../js/lib/lit-all.min.js">
	<title>FlowMouse</title>
	<style>
		:root {
			--bg: #0b0c11;
			--surface: rgba(255, 255, 255, 0.035);
			--surface-strong: rgba(255, 255, 255, 0.06);
			--line: rgba(255, 255, 255, 0.09);
			--line-strong: rgba(255, 255, 255, 0.16);
			--text-primary: #f3f4f8;
			--text-secondary: rgba(226, 230, 240, 0.7);
			--text-muted: rgba(226, 230, 240, 0.42);
			--accent-primary: #4285f4; 
			--accent-text: #6ea6ff;
			--accent-glow: rgba(66, 133, 244, 0.45);
			--accent-success: #3fb768;
			--accent-success-text: #6fd894;
			--accent-success-glow: rgba(63, 183, 104, 0.4);
			--accent-hover: #3b78e0;
			--link-hover: #8fbaff;
			--page-glow: rgba(66, 133, 244, 0.16);
			--title-gradient: linear-gradient(180deg, #ffffff 30%, #b6c9ef 100%);
			--mouse-body: linear-gradient(180deg, #252733 0%, #14151c 100%);
			--mouse-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 40px -16px rgba(0, 0, 0, 0.8);
			--mouse-button: rgba(255, 255, 255, 0.04);
			--mouse-wheel: #2a2c38;
			--accent-surface: rgba(66, 133, 244, 0.1);
			--accent-border: rgba(66, 133, 244, 0.55);
			--success-surface: rgba(63, 183, 104, 0.08);
			--success-border: rgba(63, 183, 104, 0.55);
			--warning-bg: rgba(230, 161, 23, 0.08);
			--warning-border: rgba(230, 161, 23, 0.3);
			--warning-text: rgba(255, 240, 214, 0.92);
			--popover-bg: rgba(24, 26, 34, 0.94);
			--popover-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.6);
			--arrow-shadow: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
			color-scheme: dark;

			--ease-out: cubic-bezier(0.33, 1, 0.68, 1); 
			--ease-in: cubic-bezier(0.32, 0, 0.67, 0); 
			--ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); 
			--ease-loop: cubic-bezier(0.37, 0, 0.63, 1); 
			--ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1); 
			--ease-burst: cubic-bezier(0.16, 1, 0.3, 1); 
			--dur-press: 90ms;
			--dur-fast: 200ms;
			--dur-medium: 350ms;
			--dur-slow: 550ms;
			--dur-slower: 700ms;
			--stagger: 70ms;
			--font-family: 'Segoe UI', sans-serif;
		}

		body[data-theme="light"] {
			--bg: #f0f2f5;
			--surface: #ffffff;
			--surface-strong: #ffffff;
			--line: rgba(0, 0, 0, 0.08);
			--line-strong: rgba(0, 0, 0, 0.14);
			--text-primary: #1d2025;
			--text-secondary: #5c6370;
			--text-muted: #8d939c;
			--accent-text: #2f6fe0;
			--accent-glow: rgba(66, 133, 244, 0.35);
			--accent-success: #2fa45a;
			--accent-success-text: #23894a;
			--accent-success-glow: rgba(47, 164, 90, 0.3);
			--accent-hover: #3367d6;
			--link-hover: #1a56c7;
			--page-glow: rgba(66, 133, 244, 0.1);
			--title-gradient: linear-gradient(180deg, #1b1e24 30%, #41557f 100%);
			--mouse-body: linear-gradient(180deg, #ffffff 0%, #eceef3 100%);
			--mouse-shadow: inset 0 1px 0 #ffffff, 0 20px 40px -18px rgba(30, 40, 70, 0.28);
			--mouse-button: rgba(0, 0, 0, 0.02);
			--mouse-wheel: #d9dce3;
			--accent-surface: rgba(66, 133, 244, 0.1);
			--accent-border: rgba(66, 133, 244, 0.5);
			--success-surface: rgba(47, 164, 90, 0.08);
			--success-border: rgba(47, 164, 90, 0.5);
			--warning-bg: #fff6e0;
			--warning-border: rgba(214, 150, 10, 0.35);
			--warning-text: #6b4e0a;
			--popover-bg: rgba(255, 255, 255, 0.97);
			--popover-shadow: 0 8px 20px -10px rgba(30, 40, 70, 0.25);
			--arrow-shadow: drop-shadow(0 4px 8px rgba(30, 40, 70, 0.2));
			color-scheme: light;
		}

		@media (prefers-color-scheme: light) {
			body:not([data-theme]) {
				--bg: #f0f2f5;
				--page-glow: rgba(66, 133, 244, 0.1);
			}
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			height: 100%;
			overflow: hidden;
		}

		html {
			background: var(--bg);
		}

		body {
			font-family: var(--font-family);
			background: radial-gradient(ellipse 80% 60% at 50% -15%, var(--page-glow), transparent 70%), var(--bg);
			color: var(--text-primary);
			display: flex;
			align-items: center;
			justify-content: center;
			user-select: none;
			-webkit-user-select: none;
			text-autospace: normal;
		}

		html[lang="ko"] body {
			word-break: keep-all;
		}

		body.tutorial-active {
			cursor: default;
		}

		tutorial-page {
			display: contents;
		}

		.tutorial-container {
			position: relative;
			width: 100%;
			height: 100%;
			max-width: 1200px;
			max-height: 800px;
			overflow: hidden;
		}

		.step-section {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 40px;
			opacity: 0;
			visibility: hidden;
			overflow-y: auto;
			scrollbar-width: thin;
			scrollbar-color: var(--line-strong) transparent;
			justify-content: safe center;
			scrollbar-gutter: stable;
		}

		.step-section.active {
			opacity: 1;
			visibility: visible;
		}

		.step-section.leave-forward,
		.step-section.leave-back,
		.step-section.leave-swipe {
			visibility: visible;
			pointer-events: none;
		}

		.step-section.active.enter-forward,
		.step-section.active.enter-back,
		.step-section.active.enter-intro { animation: fm-fade-in var(--dur-medium) var(--ease-out) both; }
		.step-section.leave-forward,
		.step-section.leave-back { animation: fm-fade-out var(--dur-fast) var(--ease-in) both; }

		.step-section.active.enter-swipe { animation: fm-swipe-in var(--dur-slow) var(--ease-out) 100ms both; }
		.step-section.leave-swipe { animation: fm-swipe-out 250ms var(--ease-in) both; }

		@keyframes fm-swipe-in {
			from { opacity: 0; transform: translateX(56px); }
		}

		@keyframes fm-swipe-out {
			from { opacity: 1; transform: none; }
			to { opacity: 0; transform: translateX(-56px); }
		}

		@keyframes fm-fade-in {
			from { opacity: 0; }
		}

		@keyframes fm-fade-out {
			from { opacity: 1; }
			to { opacity: 0; }
		}

		:where(.step-section.enter-forward, .step-section.enter-back, .step-section.enter-intro) > * {
			animation: fm-rise var(--dur-slow) var(--ease-out) backwards;
			animation-delay: calc(var(--i, 0) * var(--stagger) + 80ms);
		}

		:where(.step-section) > :nth-child(2) { --i: 1; }
		:where(.step-section) > :nth-child(3) { --i: 2; }
		:where(.step-section) > :nth-child(4) { --i: 3; }
		:where(.step-section) > :nth-child(5) { --i: 4; }
		:where(.step-section) > :nth-child(6) { --i: 5; }
		:where(.step-section) > :nth-child(7) { --i: 6; }

		@keyframes fm-rise {
			from { opacity: 0; transform: translateY(12px); }
		}

		.step-title {
			--glyph-room: 0.15em;
			font-size: clamp(2rem, 5vw, 3.5rem);
			font-weight: 700;
			line-height: 1.2;
			text-align: center;
			padding-block: var(--glyph-room);
			margin-top: calc(-1 * var(--glyph-room));
			margin-bottom: calc(16px - var(--glyph-room));
			background: var(--title-gradient);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
		}

		tutorial-gestures .step-title,
		tutorial-super-drag .step-title {
			margin-top: calc(40px - var(--glyph-room));
		}

		.step-subtitle {
			font-size: clamp(1rem, 2.5vw, 1.5rem);
			color: var(--text-secondary);
			text-align: center;
			margin-bottom: 40px;
			font-weight: 400;
		}

		.step-instruction {
			font-size: clamp(1.1rem, 2vw, 1.3rem);
			color: var(--text-secondary);
			text-align: center;
			line-height: 1.6;
			margin-top: 20px;
		}

		.step-instruction strong {
			color: var(--accent-text);
			font-weight: 600;
		}

		.step-instruction[data-hint="pressing"] svg {
			animation: fm-hint-nudge 1.4s var(--ease-loop) 400ms infinite;
		}

		@keyframes fm-hint-nudge {
			0% { transform: none; animation-timing-function: var(--ease-out); }
			22% { transform: translateX(0.22em); animation-timing-function: var(--ease-in-out); }
			55%, 100% { transform: none; }
		}

		tutorial-super-drag .text-highlight,
		.settings-instruction .text-highlight {
			color: var(--accent-success-text);
		}

		.text-highlight {
			color: var(--accent-text);
			font-weight: 600;
		}

		.virtual-mouse-container {
			position: relative;
			margin: 40px 0 20px 0;
		}

		.virtual-mouse {
			width: 80px;
			height: 130px;
			position: relative;
			border-radius: 40px 40px 44px 44px / 46px 46px 50px 50px;
			background: var(--mouse-body);
			border: 1px solid var(--line-strong);
			box-shadow: var(--mouse-shadow);
		}

		.mouse-button {
			position: absolute;
			width: 35px;
			height: 55px;
			top: 4px;
			background: var(--mouse-button);
			border: 1px solid var(--line);
		}

		.mouse-left {
			left: 4px;
			border-radius: 32px 3px 3px 8px / 38px 3px 3px 8px;
			--btn-color: var(--accent-success);
			--btn-glow: var(--accent-success-glow);
		}

		.mouse-right {
			right: 4px;
			border-radius: 3px 32px 8px 3px / 3px 38px 8px 3px;
			--btn-color: var(--accent-primary);
			--btn-glow: var(--accent-glow);
		}

		.mouse-button::before {
			content: '';
			position: absolute;
			inset: -1px;
			border-radius: inherit;
			background: var(--btn-color);
			box-shadow: 0 0 18px var(--btn-glow);
			opacity: 0;
			transition: opacity var(--dur-fast) var(--ease-out);
		}

		.mouse-button::after {
			content: '';
			position: absolute;
			left: 50%;
			top: 50%;
			width: 34px;
			height: 34px;
			margin: -17px 0 0 -17px;
			border-radius: 50%;
			border: 2px solid var(--btn-color);
			opacity: 0;
			pointer-events: none;
		}

		.step-section.active .mouse-button.pulsing::before {
			animation: fm-btn-press 1.8s var(--ease-loop) infinite;
		}

		.step-section.active .mouse-button.pulsing::after {
			animation: fm-btn-ripple 1.8s var(--ease-burst) infinite;
		}

		.step-section.active .mouse-button.pressed::before {
			animation: none;
			opacity: 1;
			transition-duration: var(--dur-press);
		}

		.step-section.active .mouse-button.pressed::after {
			animation: none;
		}

		@keyframes fm-btn-press {
			0%, 18% { opacity: 0.08; }
			26% { opacity: 1; }
			62%, 100% { opacity: 0.08; }
		}

		@keyframes fm-btn-ripple {
			0%, 22% { opacity: 0; transform: scale(0.5); }
			28% { opacity: 0.9; }
			85%, 100% { opacity: 0; transform: scale(2.6); }
		}

		.mouse-wheel {
			position: absolute;
			width: 10px;
			height: 20px;
			left: 50%;
			top: 15px;
			transform: translateX(-50%);
			background: var(--mouse-wheel);
			border-radius: 5px;
			border: 1px solid var(--line-strong);
		}

		.gesture-guide {
			--distance: 150px; 
			--progress: 0;
			position: fixed;
			left: 0;
			top: 0;
			z-index: 900;
			width: 0;
			height: 0;
			color: var(--accent-primary); 
			pointer-events: none;
			opacity: 0;
			transition: opacity var(--dur-fast) var(--ease-in), color var(--dur-fast);
		}

		.gesture-guide.visible:not(.ready) {
			opacity: 1;
			transition: color 0.2s;
		}

		.gesture-guide.ready {
			opacity: 0;
		}

		.guide-track {
			--consumed: max(0px, calc(var(--progress) * var(--distance) - 7px));
			position: absolute;
			left: 7px;
			top: -2px;
			width: calc(var(--distance) - 17px);
			height: 4px;
			overflow: hidden;
			-webkit-mask-image: linear-gradient(90deg, transparent var(--consumed), #000 calc(var(--consumed) + 6px), #000 calc(100% - 6px), transparent);
			mask-image: linear-gradient(90deg, transparent var(--consumed), #000 calc(var(--consumed) + 6px), #000 calc(100% - 6px), transparent);
			opacity: 0.9;
			transition: opacity 0.2s;
		}

		.guide-reveal {
			position: absolute;
			inset: 0;
		}

		.guide-dots {
			position: absolute;
			top: 0;
			bottom: 0;
			left: -10px;
			right: 0;
			background: radial-gradient(circle, currentColor 1.6px, transparent 2.1px) 0 50% / 10px 100% repeat-x;
		}

		.guide-head {
			position: absolute;
			left: calc(var(--distance) - 20px);
			top: -10px;
			width: 20px;
			height: 20px;
			overflow: visible;
			fill: none;
			stroke: currentColor;
			stroke-width: 3;
			stroke-linecap: round;
			stroke-linejoin: round;
			transition: opacity 0.2s;
		}

		.guide-head .guide-halo {
			stroke: var(--bg);
			stroke-width: 7;
		}

		.guide-origin {
			position: absolute;
			left: -6px;
			top: -6px;
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: currentColor;
			box-shadow: 0 0 0 2px var(--bg);
		}

		.gesture-guide.visible .guide-origin {
			animation: fm-pop-in 0.35s var(--ease-spring);
		}

		.gesture-guide.visible .guide-reveal {
			animation: fm-guide-draw 0.4s cubic-bezier(0.25, 0.6, 0.3, 1) both;
		}

		.gesture-guide.visible .guide-head {
			animation: fm-guide-head 0.4s cubic-bezier(0.25, 0.6, 0.3, 1) both;
		}

		.gesture-guide.visible .guide-dots {
			animation: fm-guide-flow 0.8s linear infinite;
		}

		@keyframes fm-pop-in {
			from { transform: scale(0); }
		}

		@keyframes fm-guide-draw {
			from { clip-path: inset(0 100% 0 0); }
			to { clip-path: inset(0 0 0 0); }
		}

		@keyframes fm-guide-head {
			from { opacity: 0; transform: translateX(calc(16px - var(--distance))); }
			12% { opacity: 1; }
		}

		@keyframes fm-guide-flow {
			to { transform: translateX(10px); }
		}

		.stroke-sparks {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 900;
			pointer-events: none;
		}

		.gesture-guide.off {
			color: var(--text-muted);
		}

		.gesture-guide.off .guide-track,
		.gesture-guide.off .guide-head {
			opacity: 0.45;
		}

		.cards-grid {
			display: grid;
			grid-template-columns: repeat(5, 1fr);
			gap: 14px;
			max-width: 1000px;
			margin: 30px 0;
		}

		.glass-card {
			position: relative;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 18px;
			padding: 22px 18px 18px;
			text-align: center;
			min-width: 120px;
			transition: border-color var(--dur-medium) var(--ease-out), background-color var(--dur-medium) var(--ease-out);
			--ring-scale: 1.14;
			--ring-color: var(--accent-primary); 
		}

		.card-icon {
			font-size: 2rem;
			margin-bottom: 10px;
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			transition: color var(--dur-medium) var(--ease-out);
		}

		.glass-card.completed .card-icon {
			color: var(--accent-text);
		}

		.glass-card.completed {
			border-color: var(--accent-border);
			background: var(--accent-surface);
		}

		.card-name {
			font-size: 0.92rem;
			color: var(--text-primary);
			opacity: 0.88;
			margin-bottom: 8px;
		}

		.card-status {
			font-size: 0.8rem;
			color: var(--text-muted);
			transition: color 0.3s;
		}

		.glass-card.completed .card-status {
			color: var(--accent-text);
		}

		.glass-card.completed .card-status::before {
			content: '';
			display: inline-block;
			width: 0.95em;
			height: 0.95em;
			margin-inline-end: 4px;
			vertical-align: -0.12em;
			background-color: currentColor;
			-webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center / contain no-repeat;
			mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center / contain no-repeat;
		}

		.glass-card::after,
		.draggable-content-box::after,
		.settings-drag-container::after {
			content: '';
			position: absolute;
			inset: -1px;
			border-radius: inherit;
			border: 2px solid var(--ring-color, var(--accent-success));
			opacity: 0;
			pointer-events: none;
		}

		.success-pulse {
			animation: fm-pop var(--dur-slow) both;
		}

		.success-pulse::after {
			animation: fm-ring var(--dur-slower) var(--ease-burst);
		}

		@keyframes fm-pop {
			from { animation-timing-function: var(--ease-out); }
			35% { transform: scale(1.04); animation-timing-function: var(--ease-in-out); }
			to { transform: none; }
		}

		@keyframes fm-ring {
			from { opacity: 0.8; }
			to { opacity: 0; transform: scale(var(--ring-scale, 1.06)); }
		}

		.super-drag-instruction {
			display: flex;
			align-items: center;
			gap: 24px;
			margin-bottom: 20px;
			padding: 20px 32px;
			background: var(--surface);
			border-radius: 22px;
			border: 1px solid var(--line);
		}

		.super-drag-instruction .virtual-mouse-container {
			margin: 0;
		}

		.drag-arrow-indicator {
			position: relative;
			flex: none;
			width: 120px;
			height: 40px;
			color: var(--accent-success);
		}

		.drag-arrow-origin {
			--distance: 104px;
			--progress: 0;
			position: absolute;
			left: 8px;
			top: 50%;
		}

		.step-section.active .super-drag-instruction:not(.done) .guide-dots {
			animation: fm-guide-flow 0.8s linear infinite;
		}

		.drag-hint-box {
			text-align: start;
		}

		.hint-title {
			font-size: 1.1rem;
			font-weight: 600;
			color: var(--accent-success-text);
			margin-bottom: 4px;
		}

		.hint-desc {
			font-size: 0.9rem;
			color: var(--text-secondary);
		}

		.draggable-content-box {
			position: relative;
			width: 400px;
			padding: 36px 40px;
			margin-top: clamp(0px, 15vh - 105px, 30px);
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 22px;
			text-align: center;
		}

		.draggable-content-box.completed,
		.settings-drag-container.completed {
			border-color: var(--success-border);
			background: var(--success-surface);
		}

		.draggable-content-box.completed .box-label {
			color: var(--accent-success-text);
		}

		.box-label {
			font-size: 1.2rem;
			color: var(--text-muted);
			margin-bottom: 15px;
			transition: color 0.3s;
		}

		.selectable-text {
			font-size: 1.2rem;
			font-weight: 600;
			color: var(--accent-text);
			user-select: text;
			-webkit-user-select: text;
			cursor: text;
			padding: 10px;
			background: var(--accent-surface);
			border-radius: 10px;
		}

		.continue-row {
			height: 60px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-top: 20px;
		}

		.btn {
			font: inherit;
			font-size: 1rem;
			font-weight: 600;
			border: 0;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}

		.btn-primary {
			padding: 12px 32px;
			margin-bottom: 10px;
			border-radius: 10px;
			color: #fff;
			background: var(--accent-primary);
			transition: background-color 0.2s;
		}

		.btn-primary:hover {
			background: var(--accent-hover);
		}

		.btn-primary:focus-visible {
			outline: 2px solid var(--accent-text);
			outline-offset: 3px;
		}

		.continue-btn {
			visibility: hidden;
			opacity: 0;
			transition: opacity var(--dur-medium) var(--ease-out), visibility 0s var(--dur-medium), background-color var(--dur-fast);
		}

		.continue-btn.is-visible {
			visibility: visible;
			opacity: 1;
			transition-delay: 0s;
		}

		.try-again-message {
			position: fixed;
			top: 20px;
			left: 50%;
			transform: translate(-50%, -24px) scale(0.96);
			background: rgba(229, 72, 77, 0.96);
			color: white;
			padding: 11px 24px;
			border-radius: 999px;
			font-size: 1rem;
			font-weight: 600;
			box-shadow: 0 12px 30px -12px rgba(229, 72, 77, 0.9);
			opacity: 0;
			pointer-events: none;
			transition: opacity var(--dur-fast) var(--ease-in), transform var(--dur-fast) var(--ease-in);
			z-index: 1000;
		}

		.try-again-message.show {
			transform: translate(-50%, 0);
			opacity: 1;
			transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-medium) var(--ease-spring);
		}

		.try-again-message .text-highlight {
			color: #fff; 
			text-decoration: underline;
		}

		.completion-icon {
			font-size: 5rem;
			margin-bottom: 20px;
		}

		.completion-icon > span {
			display: inline-block;
			animation: completion-bounce 1.6s var(--ease-loop) infinite;
		}

		@keyframes completion-bounce {
			50% { transform: scale(1.06); }
		}

		.settings-drag-container {
			position: relative;
			margin-top: 30px;
			padding: 36px 40px;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 22px;
			text-align: center;
		}

		.settings-link {
			display: inline-block;
			font-size: 1.5rem;
			color: var(--accent-text);
			text-decoration: underline;
			text-underline-offset: 0.18em;
			padding: 10px 10px 16px 10px;
			font-weight: 600;
			cursor: pointer;
			transition: color 0.2s;
			background: transparent;
			margin: 10px 0;
			border: none;
		}

		.settings-link:hover {
			color: var(--link-hover);
		}

		.settings-instruction {
			margin-bottom: 20px;
			color: var(--text-secondary);
			font-size: 1.1rem;
			transition: color 0.3s;
		}

		.settings-hint {
			margin-top: 15px;
			font-size: 1.1rem;
			color: var(--text-secondary);
		}

		.discovery-expand-wrapper {
			display: grid;
			grid-template-rows: 0fr;
			transition: grid-template-rows var(--dur-slower) var(--ease-burst), margin-top var(--dur-slower) var(--ease-burst);
			width: 100%;
			max-width: 850px;
			margin: 0 auto;
		}

		.discovery-expand-wrapper.visible {
			grid-template-rows: 1fr;
			margin-top: 30px;
			transition-delay: 450ms;
		}

		.discovery-banner {
			border: 1px dashed var(--line-strong);
			border-radius: 18px;
			padding: 22px 24px;
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 15px;
			overflow: hidden;
			opacity: 0;
			transition: opacity 0.5s ease 0.15s;
		}

		.discovery-expand-wrapper.visible .discovery-banner {
			opacity: 1;
			transition-delay: 600ms;
		}

		.discovery-header {
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: var(--text-muted);
			font-weight: 600;
		}

		.discovery-grid {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			justify-content: center;
		}

		.discovery-item {
			display: flex;
			align-items: center;
			gap: 8px;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 9px;
			padding: 6px 14px;
			transition: border-color 0.3s, background-color 0.3s;
		}

		.discovery-item.completed {
			border-color: var(--accent-border);
			background: var(--accent-surface);
		}

		.discovery-item.completed .discovery-name,
		.discovery-item.completed .discovery-icon {
			color: var(--accent-text);
		}

		.discovery-icon {
			font-size: 1rem;
			color: var(--accent-text);
			display: flex;
			align-items: center;
		}

		.discovery-icon > .chip-icon {
			width: 1em;
			height: 1em;
		}

		.discovery-name {
			font-size: 0.82rem;
			color: var(--text-secondary);
		}

		.discovery-footer {
			font-size: 0.9rem;
			color: var(--text-muted);
		}

		.discovery-footer strong {
			color: var(--accent-text);
		}

		.setting-warning {
			background: var(--warning-bg);
			border: 1px solid var(--warning-border);
			border-radius: 14px;
			padding: 12px 20px;
			margin: 20px auto;
			max-width: 800px;
			font-size: 0.95rem;
			color: var(--warning-text);
			text-align: center;
			line-height: 1.5;
		}

		.step3-swap-container {
			display: grid;
			grid-template-areas: "stack";
			width: 100%;
			max-width: 900px; 
			margin: 10px auto;
			position: relative;
			align-items: center; 
			justify-items: center; 
		}

		.step3-swap-item {
			grid-area: stack;
			transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
		}

		.step3-swap-container #step3DiscoveryWrapper {
			opacity: 0;
			pointer-events: none;
			transform: scale(0.96);
			z-index: 1;
		}

		.step3-swap-container .draggable-content-box {
			opacity: 1;
			transform: scale(1);
			z-index: 2;
		}

		.step3-swap-container.show-discovery #step3DiscoveryWrapper {
			opacity: 1;
			pointer-events: auto;
			transform: scale(1);
			z-index: 2;
			transition-delay: 150ms;
		}

		.step3-swap-container.show-discovery .draggable-content-box {
			opacity: 0;
			pointer-events: none;
			transform: scale(1.03);
			z-index: 1;
			transition-duration: 250ms;
			transition-timing-function: var(--ease-in);
		}

		#step3DiscoveryWrapper .discovery-banner {
			opacity: 1 !important;
			transition: none !important; 
		}

		#step3DiscoveryWrapper {
			display: block;
			width: 100%;
			grid-template-rows: auto;
			margin: 0;
			align-self: end; 
		}

		@media (max-width: 768px) {
			.cards-grid {
				grid-template-columns: repeat(3, 1fr);
				gap: 12px;
			}

			.discovery-grid {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				width: 100%;
			}

			.discovery-item {
				justify-content: center;
			}

			.draggable-content-box {
				width: 100%;
				max-width: 300px;
			}

			.step-section {
				padding: 20px;
			}
		}

		@media (max-height: 760px) {
			.step-section {
				padding-block: 24px;
			}

			.step-title {
				font-size: clamp(2rem, min(5vw, 7vh), 3.5rem);
			}

			.step-subtitle {
				margin-bottom: 24px;
			}

			tutorial-gestures .step-title,
			tutorial-super-drag .step-title {
				margin-top: calc(-1 * var(--glyph-room));
			}

			.cards-grid {
				margin: 20px 0;
			}

			.discovery-expand-wrapper.visible {
				margin-top: 20px;
			}

			.continue-row {
				margin-top: 12px;
			}
		}

		.pin-hint-wrapper {
			position: fixed;
			top: 35px;
			right: 25px;
			z-index: 2000;
			display: flex;
			flex-direction: column;
			align-items: center;
			pointer-events: none;
			opacity: 0;
			transform: translateY(-16px);
			transition: opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out);
		}

		body[data-active-step="done"] .pin-hint-wrapper {
			opacity: 1;
			transform: none;
			pointer-events: auto;
			transition-delay: 1s; 
		}

		.pin-hint-arrow {
			width: 32px;
			height: 32px;
			margin-bottom: 5px;
			color: var(--text-secondary);
			filter: var(--arrow-shadow);
		}

		body[data-active-step="done"] .pin-hint-arrow {
			animation: bounce-point 1.6s var(--ease-loop) 1.4s 3;
		}

		@keyframes bounce-point {
			50% { transform: translateY(-8px); }
		}

		.pin-hint-content {
			background: var(--popover-bg);
			border: 1px solid var(--line-strong);
			box-shadow: var(--popover-shadow);
			color: var(--text-primary);
			padding: 16px 24px;
			border-radius: 16px;
			font-size: 0.95rem;
			max-width: 320px;
			line-height: 1.6;
			display: flex;
			align-items: flex-start;
			gap: 12px;
		}

		.pin-hint-content b {
			color: var(--accent-text);
		}

		.icon-ext, .icon-pin {
			display: inline-block;
			width: 20px;
			height: 20px;
			vertical-align: -5px;
			background-color: var(--accent-text);
			mask-repeat: no-repeat;
			mask-position: center;
			mask-size: contain;
			margin-inline-start: 4px;
			margin-inline-end: 4px;
		}

		.icon-pin {
			mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m624-480 96 96v72H516v228l-36 36-36-36v-228H240v-72l96-96v-264h-48v-72h384v72h-48v264Zm-282 96h276l-66-66v-294H408v294l-66 66Zm138 0Z"/></svg>');

		@media (max-width: 860px) {
			.pin-hint-wrapper {
				right: 16px;
			}

			.pin-hint-content {
				max-width: 240px;
				padding: 12px 16px;
				font-size: 0.85rem;
			}
		}
